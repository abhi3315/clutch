[package]
name = "clutch"
version = "0.1.0"
edition = "2021"
description = "CLI clipboard sanitizer — redacts secrets before you paste"
license = "MIT"
keywords = ["clipboard", "security", "secrets", "redaction", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/abhi3315/clutch"
homepage = "https://github.com/abhi3315/clutch"

[dependencies]
arboard = "3"
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
